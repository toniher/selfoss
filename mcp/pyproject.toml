[project]
name = "selfoss-mcp"
version = "0.1.0"
description = "MCP server exposing a selfoss instance's REST API to MCP clients"
requires-python = ">=3.10"
dependencies = [
    # Pinned below 2: mcp 2.x renamed FastMCP to MCPServer and reworked the
    # auth API. Bump this deliberately once the plan is updated for it.
    "mcp>=1.6,<2",
    "httpx>=0.27",
]

[project.scripts]
selfoss-mcp = "selfoss_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfoss_mcp"]

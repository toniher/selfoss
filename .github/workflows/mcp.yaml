# Separate from main.yaml so it doesn't need to touch upstream's workflow
# file. Runs on changes that could break the MCP server: its own code, or
# the documented API it depends on.
name: MCP server

on:
  pull_request:
    paths:
      - "mcp/**"
      - "docs/api-description.json"
      - "index.php"
      - ".github/workflows/mcp.yaml"
  push:
    paths:
      - "mcp/**"
      - "docs/api-description.json"
      - "index.php"
      - ".github/workflows/mcp.yaml"

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # The ci shell's Python (from upstream's flake.nix) has no pip, so a bare
      # `pip` would be the runner's system one, installing for a different
      # interpreter. Use a venv built from the nix Python instead, leaving
      # flake.nix untouched. requests/bcrypt are for the integration harness.
      - name: Install selfoss and selfoss-mcp dependencies
        run: |
          nix-shell -A ci --run 'npm run install-dependencies'
          nix-shell -A ci --run 'python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -e mcp requests bcrypt'

      - name: Run selfoss-mcp tests
        run: nix-shell -A ci --run 'SELFOSS_TEST_STORAGE_BACKEND=sqlite "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s mcp/tests'

      - name: Check selfoss-mcp formatting
        run: nix-shell -A ci --run 'black --check mcp/'

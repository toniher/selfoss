# Based on https://github.com/toniher/docker-selfoss nginx-default.conf, with
# security fixes. selfoss skips login when REMOTE_ADDR is 127.0.0.1/::1
# (src/helpers/Authentication/AuthenticationFactory.php). The original config
# set REMOTE_ADDR from the client-supplied X-Real-IP header, so anyone could
# send "X-Real-IP: 127.0.0.1" and bypass login. REMOTE_ADDR is now left as
# the real TCP peer (never loopback inside the container). Do not add the
# realip module back: any trusted range would include the Docker gateway,
# i.e. every local process on the host. The host proxy logs real client IPs.
server {
	listen                  80;
	server_name             localhost 127.0.0.1;
	server_name_in_redirect off;

	access_log          /var/log/nginx/selfoss.access.log;
	error_log           /var/log/nginx/selfoss.error.log;

	charset             utf-8;
	source_charset      utf-8;

	gzip            on;
	gzip_http_version 1.0;
	gzip_comp_level 2;
	gzip_proxied any;
	gzip_types      text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

	fastcgi_read_timeout 600s;
	client_max_body_size 100M;

	index                       index.html index.php;

	root	/var/www/htdocs;

	location ~ ^/(favicons|thumbnails)/.*$ {
		try_files $uri /data/$uri;
	}

	# src/ and vendor/ PHP files must never be executed directly.
	location ~* ^/(data/(logs|sqlite|cache)|src/|vendor/|config\.ini|\.ht) {
		deny all;
	}

	location / {
		index index.php;
		try_files $uri /public/$uri /index.php$is_args$args;
	}

	location ~ .php$ {
		include         /etc/nginx/fastcgi_params;

		fastcgi_pass    unix:/var/run/php/php8.2-fpm.sock;
		fastcgi_index   index.php;

		fastcgi_split_path_info ^(.+\.php)(/.*)$;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param SERVER_NAME $host;
		fastcgi_param HTTP_PROXY "";
		try_files $uri =404;
		fastcgi_intercept_errors on;
		fastcgi_request_buffering off;
		# No REMOTE_ADDR override here (see the top of this file).
	}
}
